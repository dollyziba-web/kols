<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <rect width="1600" height="1000" fill="#0F1215"/>
  <rect x="40" y="40" width="1520" height="920" fill="none" stroke="#A58B62" stroke-width="1.5"/>

  <!-- Multi-Layer AutoCAD DWG Color-Coded Vector Representation -->
  <g stroke="#3A424A" stroke-width="0.6" stroke-dasharray="6,6">
    <line x1="200" y1="80" x2="200" y2="920"/>
    <line x1="500" y1="80" x2="500" y2="920"/>
    <line x1="800" y1="80" x2="800" y2="920"/>
    <line x1="1100" y1="80" x2="1100" y2="920"/>
    <line x1="80" y1="240" x2="1220" y2="240"/>
    <line x1="80" y1="500" x2="1220" y2="500"/>
    <line x1="80" y1="760" x2="1220" y2="760"/>
  </g>

  <!-- Layer A-WALL-FULL (Ivory) -->
  <g stroke="#F3F0E9" stroke-width="2.5" fill="none">
    <rect x="200" y="240" width="900" height="520"/>
    <line x1="500" y1="240" x2="500" y2="760"/>
    <line x1="800" y1="240" x2="800" y2="760"/>
    <line x1="200" y1="500" x2="1100" y2="500"/>
  </g>

  <!-- Layer S-COLS (Bronze Structural Columns) -->
  <g fill="#A58B62">
    <rect x="190" y="230" width="20" height="20"/>
    <rect x="490" y="230" width="20" height="20"/>
    <rect x="790" y="230" width="20" height="20"/>
    <rect x="1090" y="230" width="20" height="20"/>
    <rect x="190" y="490" width="20" height="20"/>
    <rect x="490" y="490" width="20" height="20"/>
    <rect x="790" y="490" width="20" height="20"/>
    <rect x="1090" y="490" width="20" height="20"/>
    <rect x="190" y="750" width="20" height="20"/>
    <rect x="490" y="750" width="20" height="20"/>
    <rect x="790" y="750" width="20" height="20"/>
    <rect x="1090" y="750" width="20" height="20"/>
  </g>

  <!-- Layer A-ANNO-DIMS (Cyan/Teal CAD Dimensioning) -->
  <g stroke="#56B6C2" stroke-width="1" fill="#56B6C2" font-family="monospace" font-size="11" text-anchor="middle">
    <line x1="200" y1="180" x2="1100" y2="180"/>
    <text x="350" y="170">9,000 MM</text>
    <text x="650" y="170">9,000 MM</text>
    <text x="950" y="170">9,000 MM</text>
  </g>

  <!-- CAD Layer Manager Panel on Right -->
  <g transform="translate(1240, 80)">
    <rect x="0" y="0" width="280" height="840" fill="#17191B" stroke="#A58B62" stroke-width="1.2"/>
    <text x="24" y="50" fill="#F3F0E9" font-family="monospace" font-size="14" letter-spacing="2">AUTOCAD .DWG LAYERS</text>
    <text x="24" y="74" fill="#A58B62" font-family="monospace" font-size="10">ISO 13567 STANDARDIZED</text>
    <g font-family="monospace" font-size="11" fill="#F3F0E9">
      <text x="24" y="130">■ A-WALL-EXTR (0.50mm)</text>
      <text x="24" y="165">■ A-WALL-INTR (0.35mm)</text>
      <text x="24" y="200" fill="#A58B62">■ S-GRID-COLS (0.40mm)</text>
      <text x="24" y="235" fill="#56B6C2">■ A-ANNO-DIMS (0.18mm)</text>
      <text x="24" y="270" fill="#A9A9A3">■ A-FURN-FIXT (0.15mm)</text>
      <text x="24" y="305" fill="#A9A9A3">■ A-GLAZ-CURT (0.25mm)</text>
    </g>
    <text x="24" y="780" fill="#F3F0E9" font-family="serif" font-size="32">DWG-110</text>
  </g>
</svg>
