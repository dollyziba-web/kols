<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25282B" stroke-width="0.6"/>
    </pattern>
    <pattern id="subgrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#313539" stroke-width="1.2"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#A58B62" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Charcoal CAD Sheet Background -->
  <rect width="1600" height="1000" fill="#17191B"/>
  <rect x="40" y="40" width="1520" height="920" fill="url(#subgrid)" stroke="#A58B62" stroke-width="1.5"/>
  <rect x="52" y="52" width="1496" height="896" fill="none" stroke="#A9A9A3" stroke-width="0.6" opacity="0.5"/>

  <!-- Structural Grid Axes -->
  <g stroke="#A58B62" stroke-width="0.7" stroke-dasharray="10,6" opacity="0.55">
    <line x1="220" y1="90" x2="220" y2="880"/>
    <line x1="520" y1="90" x2="520" y2="880"/>
    <line x1="860" y1="90" x2="860" y2="880"/>
    <line x1="1140" y1="90" x2="1140" y2="880"/>
    <line x1="120" y1="200" x2="1240" y2="200"/>
    <line x1="120" y1="480" x2="1240" y2="480"/>
    <line x1="120" y1="760" x2="1240" y2="760"/>
  </g>

  <!-- Grid Bubbles -->
  <g fill="#17191B" stroke="#A58B62" stroke-width="1.2" font-family="monospace" font-size="12" text-anchor="middle">
    <circle cx="220" cy="90" r="14"/><text x="220" y="94" fill="#F3F0E9" stroke="none">A</text>
    <circle cx="520" cy="90" r="14"/><text x="520" y="94" fill="#F3F0E9" stroke="none">B</text>
    <circle cx="860" cy="90" r="14"/><text x="860" y="94" fill="#F3F0E9" stroke="none">C</text>
    <circle cx="1140" cy="90" r="14"/><text x="1140" y="94" fill="#F3F0E9" stroke="none">D</text>
    <circle cx="120" cy="200" r="14"/><text x="120" y="204" fill="#F3F0E9" stroke="none">1</text>
    <circle cx="120" cy="480" r="14"/><text x="120" y="484" fill="#F3F0E9" stroke="none">2</text>
    <circle cx="120" cy="760" r="14"/><text x="120" y="764" fill="#F3F0E9" stroke="none">3</text>
  </g>

  <!-- Main Architectural Floor Plan Walls -->
  <g stroke="#F3F0E9" stroke-width="2.5" fill="url(#hatch)">
    <!-- Outer Perimeter Walls -->
    <rect x="214" y="194" width="932" height="12"/>
    <rect x="214" y="194" width="12" height="572"/>
    <rect x="214" y="754" width="652" height="12"/>
    <rect x="854" y="474" width="292" height="12"/>
    <rect x="1134" y="194" width="12" height="292"/>
    <rect x="854" y="474" width="12" height="292"/>
    <!-- Interior Partition Walls -->
    <rect x="514" y="206" width="12" height="274"/>
    <rect x="514" y="540" width="12" height="214"/>
    <rect x="226" y="474" width="230" height="12"/>
    <rect x="580" y="474" width="274" height="12"/>
    <rect x="854" y="206" width="12" height="210"/>
  </g>

  <!-- Architectural Glazing & Door Swings -->
  <g stroke="#A58B62" stroke-width="1.3" fill="none">
    <!-- Door Swings -->
    <path d="M 456 480 A 58 58 0 0 1 514 538" stroke-dasharray="4,3"/>
    <line x1="456" y1="480" x2="456" y2="538" stroke="#F3F0E9" stroke-width="2"/>
    <path d="M 526 480 A 54 54 0 0 0 580 534" stroke-dasharray="4,3"/>
    <line x1="580" y1="480" x2="580" y2="534" stroke="#F3F0E9" stroke-width="2"/>
    <path d="M 860 416 A 58 58 0 0 0 918 474" stroke-dasharray="4,3"/>
    <line x1="860" y1="416" x2="918" y2="416" stroke="#F3F0E9" stroke-width="2"/>
    <!-- Reflected Water Pool / Terrace -->
    <rect x="880" y="510" width="260" height="250" stroke="#A58B62" stroke-width="1" stroke-dasharray="6,4"/>
    <line x1="880" y1="510" x2="1140" y2="760" stroke="#A58B62" stroke-width="0.5" opacity="0.4"/>
    <line x1="1140" y1="510" x2="880" y2="760" stroke="#A58B62" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Interior Furniture & Fixture CAD Blocks -->
  <g stroke="#A9A9A3" stroke-width="1" fill="none" opacity="0.85">
    <!-- Living Lounge Modular Sofa & Coffee Table -->
    <rect x="260" y="530" width="180" height="50"/>
    <rect x="260" y="580" width="50" height="120"/>
    <rect x="335" y="605" width="90" height="65" stroke="#A58B62"/>
    <!-- Dining 10-Seater Table & Kitchen Island -->
    <rect x="570" y="250" width="220" height="65" stroke="#F3F0E9" stroke-width="1.4"/>
    <circle cx="615" cy="282" r="14"/>
    <circle cx="660" cy="282" r="14"/>
    <rect x="570" y="360" width="180" height="68"/>
    <!-- Master Suite Bed & Wardrobe -->
    <rect x="930" y="240" width="140" height="160"/>
    <rect x="945" y="248" width="50" height="24"/>
    <rect x="1005" y="248" width="50" height="24"/>
    <!-- Architectural Staircase -->
    <g stroke="#F3F0E9" stroke-width="0.9">
      <rect x="550" y="560" width="140" height="60"/>
      <line x1="564" y1="560" x2="564" y2="620"/>
      <line x1="578" y1="560" x2="578" y2="620"/>
      <line x1="592" y1="560" x2="592" y2="620"/>
      <line x1="606" y1="560" x2="606" y2="620"/>
      <line x1="620" y1="560" x2="620" y2="620"/>
      <line x1="634" y1="560" x2="634" y2="620"/>
      <line x1="648" y1="560" x2="648" y2="620"/>
      <line x1="662" y1="560" x2="662" y2="620"/>
      <line x1="676" y1="560" x2="676" y2="620"/>
      <line x1="550" y1="590" x2="690" y2="590" stroke="#A58B62"/>
    </g>
  </g>

  <!-- Room Annotations -->
  <g font-family="monospace" fill="#F3F0E9" font-size="11" letter-spacing="2">
    <text x="270" y="280">01 / PRIVATE GALLERY &amp; FOYER</text>
    <text x="270" y="298" fill="#A58B62" font-size="10">42.5 SQ.M · FL +0.00</text>

    <text x="570" y="232">02 / CULINARY STUDIO &amp; DINING</text>
    <text x="570" y="452" fill="#A58B62" font-size="10">68.0 SQ.M · FL +0.00</text>

    <text x="900" y="228">03 / PRINCIPAL PAVILION SUITE</text>
    <text x="900" y="445" fill="#A58B62" font-size="10">54.2 SQ.M · FL +0.15</text>

    <text x="260" y="730">04 / DOUBLE-HEIGHT LIVING ATRIUM</text>
    <text x="260" y="745" fill="#A58B62" font-size="10">84.0 SQ.M · FL -0.30</text>

    <text x="560" y="715">05 / SCULPTURAL STAIR &amp; COURT</text>
    <text x="560" y="732" fill="#A58B62" font-size="10">46.8 SQ.M · FL +0.00</text>

    <text x="910" y="635" fill="#A58B62">06 / REFLECTING POOL TERRACE</text>
    <text x="910" y="652" fill="#A9A9A3" font-size="10">62.0 SQ.M · FL -0.15</text>
  </g>

  <!-- Dimension Lines -->
  <g stroke="#A58B62" stroke-width="0.9" fill="#A58B62" font-family="monospace" font-size="11" text-anchor="middle">
    <line x1="220" y1="145" x2="1140" y2="145"/>
    <line x1="220" y1="138" x2="220" y2="152"/>
    <line x1="520" y1="138" x2="520" y2="152"/>
    <line x1="860" y1="138" x2="860" y2="152"/>
    <line x1="1140" y1="138" x2="1140" y2="152"/>
    <text x="370" y="136">7,500 MM</text>
    <text x="690" y="136">8,500 MM</text>
    <text x="1000" y="136">7,000 MM</text>

    <line x1="220" y1="825" x2="1140" y2="825"/>
    <text x="680" y="844">TOTAL STRUCTURAL SPAN: 23,000 MM</text>
  </g>

  <!-- Architectural Title Block (Right Column) -->
  <g transform="translate(1260, 52)">
    <rect x="0" y="0" width="288" height="896" fill="#131517" stroke="#A58B62" stroke-width="1.2"/>
    <line x1="0" y1="140" x2="288" y2="140" stroke="#A58B62" stroke-width="0.8"/>
    <line x1="0" y1="320" x2="288" y2="320" stroke="#A58B62" stroke-width="0.8"/>
    <line x1="0" y1="540" x2="288" y2="540" stroke="#A58B62" stroke-width="0.8"/>
    <line x1="0" y1="740" x2="288" y2="740" stroke="#A58B62" stroke-width="0.8"/>

    <!-- Brand Stamp -->
    <text x="24" y="48" fill="#F3F0E9" font-family="serif" font-size="22" letter-spacing="4">KOLS</text>
    <text x="24" y="72" fill="#A58B62" font-family="monospace" font-size="11" letter-spacing="5">ARCHITECTS</text>
    <text x="24" y="102" fill="#A9A9A3" font-family="monospace" font-size="9" letter-spacing="1.5">ARCHITECTURE · 2D CAD · 3D VISUALIZATION</text>
    <text x="24" y="120" fill="#A9A9A3" font-family="monospace" font-size="9" letter-spacing="1.5">TECHNICAL DOCUMENTATION SHEET</text>

    <!-- Project Metadata -->
    <text x="24" y="175" fill="#A58B62" font-family="monospace" font-size="9" letter-spacing="2">PROJECT DESIGNATION</text>
    <text x="24" y="198" fill="#F3F0E9" font-family="sans-serif" font-size="14" font-weight="600">THE AURELIA RESIDENCE</text>
    <text x="24" y="220" fill="#A9A9A3" font-family="monospace" font-size="10">CONCEPTUAL TECHNICAL STUDY</text>
    <text x="24" y="255" fill="#A58B62" font-family="monospace" font-size="9" letter-spacing="2">DRAWING TITLE</text>
    <text x="24" y="278" fill="#F3F0E9" font-family="monospace" font-size="12">LEVEL 01 — GENERAL ARRANGEMENT</text>
    <text x="24" y="298" fill="#A9A9A3" font-family="monospace" font-size="10">FLOOR PLAN &amp; STRUCTURAL AXES</text>

    <!-- North Arrow & Scale -->
    <circle cx="144" cy="410" r="44" fill="none" stroke="#A58B62" stroke-width="1"/>
    <polygon points="144,366 134,424 144,412 154,424" fill="#A58B62"/>
    <text x="144" y="355" fill="#F3F0E9" font-family="monospace" font-size="11" text-anchor="middle">N</text>
    <text x="144" y="485" fill="#A9A9A3" font-family="monospace" font-size="10" text-anchor="middle">SCALE 1 : 100 @ A1</text>
    <text x="144" y="505" fill="#A58B62" font-family="monospace" font-size="10" text-anchor="middle">UNITS: MILLIMETERS (MM)</text>

    <!-- Schedule Summary -->
    <text x="24" y="575" fill="#A58B62" font-family="monospace" font-size="9" letter-spacing="2">AREA SCHEDULE</text>
    <text x="24" y="602" fill="#F3F0E9" font-family="monospace" font-size="10">INTERNAL GFA:     295.5 SQ.M</text>
    <text x="24" y="624" fill="#F3F0E9" font-family="monospace" font-size="10">TERRACE &amp; POOL:    62.0 SQ.M</text>
    <text x="24" y="646" fill="#F3F0E9" font-family="monospace" font-size="10">TOTAL FOOTPRINT:  357.5 SQ.M</text>
    <text x="24" y="680" fill="#A9A9A3" font-family="monospace" font-size="9">DELIVERABLES: DWG / PDF / BIM</text>
    <text x="24" y="700" fill="#A9A9A3" font-family="monospace" font-size="9">LAYER STANDARD: ISO 13567</text>

    <!-- Sheet Number -->
    <text x="24" y="775" fill="#A58B62" font-family="monospace" font-size="9" letter-spacing="2">SHEET NUMBER</text>
    <text x="24" y="815" fill="#F3F0E9" font-family="serif" font-size="36" letter-spacing="3">A-101</text>
    <text x="24" y="845" fill="#A9A9A3" font-family="monospace" font-size="10">REV 03 · ISSUED FOR DESIGN REVIEW</text>
    <text x="24" y="870" fill="#A58B62" font-family="monospace" font-size="9">© KOLS ARCHITECTS STUDIO</text>
  </g>
</svg>
