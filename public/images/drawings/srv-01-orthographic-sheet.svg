<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="orthoGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E4DFD4" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#F3F0E9"/>
  <rect x="36" y="36" width="1528" height="928" fill="url(#orthoGrid)" stroke="#17191B" stroke-width="2"/>
  <rect x="48" y="48" width="1504" height="904" fill="none" stroke="#A58B62" stroke-width="1"/>

  <!-- Top Section: North & East Orthographic Projections -->
  <text x="80" y="96" fill="#A58B62" font-family="monospace" font-size="11" letter-spacing="2">01 / NORTH ORTHOGRAPHIC ELEVATION · SCALE 1:100</text>
  <line x1="80" y1="360" x2="760" y2="360" stroke="#17191B" stroke-width="3.5"/>
  <rect x="140" y="160" width="540" height="200" fill="#EBE6DC" stroke="#17191B" stroke-width="2"/>
  <rect x="120" y="140" width="580" height="20" fill="#17191B"/>
  <rect x="190" y="190" width="180" height="170" fill="#DCD6C8" stroke="#17191B" stroke-width="1.4"/>
  <rect x="410" y="190" width="220" height="110" fill="#DCD6C8" stroke="#17191B" stroke-width="1.4"/>
  <g stroke="#A58B62" stroke-width="1.2">
    <line x1="250" y1="190" x2="250" y2="360"/>
    <line x1="310" y1="190" x2="310" y2="360"/>
    <line x1="480" y1="190" x2="480" y2="300"/>
    <line x1="550" y1="190" x2="550" y2="300"/>
  </g>

  <text x="840" y="96" fill="#A58B62" font-family="monospace" font-size="11" letter-spacing="2">02 / EAST ORTHOGRAPHIC ELEVATION · SCALE 1:100</text>
  <line x1="840" y1="360" x2="1500" y2="360" stroke="#17191B" stroke-width="3.5"/>
  <rect x="910" y="140" width="380" height="110" fill="#E5DFD3" stroke="#17191B" stroke-width="2"/>
  <rect x="960" y="250" width="440" height="110" fill="#F7F5F0" stroke="#17191B" stroke-width="2"/>
  <rect x="890" y="210" width="70" height="150" fill="#17191B"/>

  <!-- Bottom Section: Longitudinal Architectural Section A-A -->
  <text x="80" y="450" fill="#A58B62" font-family="monospace" font-size="11" letter-spacing="2">03 / LONGITUDINAL BUILDING SECTION A–A · STRUCTURAL &amp; DATUM COORDINATION</text>
  <line x1="80" y1="790" x2="1500" y2="790" stroke="#17191B" stroke-width="4"/>
  <rect x="160" y="500" width="1220" height="290" fill="#FAF8F4" stroke="#17191B" stroke-width="2.5"/>
  <!-- Section Cut Slabs & Columns -->
  <rect x="160" y="500" width="1220" height="18" fill="#17191B"/>
  <rect x="160" y="640" width="840" height="16" fill="#17191B"/>
  <rect x="160" y="500" width="22" height="290" fill="#17191B"/>
  <rect x="620" y="500" width="18" height="290" fill="#17191B"/>
  <rect x="1000" y="500" width="18" height="290" fill="#17191B"/>
  <rect x="1360" y="500" width="20" height="290" fill="#17191B"/>

  <!-- Section Staircase Cut -->
  <polyline points="680,790 710,765 740,765 740,740 770,740 770,715 800,715 800,690 830,690 830,665 860,665 860,640" fill="none" stroke="#A58B62" stroke-width="2.5"/>

  <!-- Title Footer -->
  <rect x="80" y="840" width="1420" height="80" fill="#17191B"/>
  <text x="110" y="886" fill="#F3F0E9" font-family="serif" font-size="24" letter-spacing="4">KOLS ARCHITECTS · ORTHOGRAPHIC DRAWING PACKAGE</text>
  <text x="1180" y="885" fill="#A58B62" font-family="monospace" font-size="14" letter-spacing="3">SHEET A-001</text>
</svg>
